<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoomCheck">
<title>RoomCheck – Kiểm tra phòng</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1a;--s1:#111827;--s2:#1a2236;--s3:#243050;
  --border:#1e2d45;--border2:#2a3f5f;
  --text:#dde4f0;--dim:#7a8aa0;--muted:#2d3f58;
  --blue:#4d9fff;--teal:#2dd4bf;--green:#34d399;--red:#f87171;--amber:#fbbf24;
  --glow:0 0 28px rgba(77,159,255,.2);
  --sans:'Outfit',sans-serif;--mono:'Fira Code',monospace;--r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100svh;
  overflow-x:hidden;
  touch-action: manipulation;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 0%,rgba(77,159,255,.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 100%,rgba(45,212,191,.05) 0%,transparent 60%);
}
.app{position:relative;z-index:1;max-width:500px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}

/* screens */
.scr{display:none;flex-direction:column;flex:1;animation:fadeUp .3s ease}
.scr.on{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── SPLASH ── */
#s-splash{align-items:center;justify-content:center;gap:20px;padding:40px;text-align:center}
.splash-ico{
  width:80px;height:80px;border-radius:24px;
  background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;font-size:40px;
  box-shadow:var(--glow);animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{box-shadow:var(--glow)}50%{box-shadow:0 0 44px rgba(77,159,255,.4)}}
.splash-title{font-size:30px;font-weight:800;letter-spacing:-1px}
.splash-sub{font-size:12px;color:var(--dim);font-family:var(--mono)}
.splash-bar{width:160px;height:3px;background:var(--s3);border-radius:3px;overflow:hidden;margin:4px auto 0}
.splash-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:3px;animation:barAnim 1.6s ease infinite}
@keyframes barAnim{0%{width:0;margin-left:0}60%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
.splash-msg{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:8px}

/* ── LOGIN ── */
#s-login{align-items:center;justify-content:center;padding:32px 24px;gap:0}
.login-card{
  width:100%;background:var(--s1);border:1px solid var(--border);
  border-radius:22px;padding:32px 24px;text-align:center;
}
.login-ico{font-size:48px;margin-bottom:16px}
.login-title{font-size:22px;font-weight:800;margin-bottom:8px}
.login-desc{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:28px}
.ms-btn{
  width:100%;padding:16px;border-radius:13px;border:none;
  background:linear-gradient(135deg,#0078d4,#005a9e);
  color:#fff;font-size:15px;font-weight:700;
  font-family:var(--sans);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .2s;box-shadow:0 4px 20px rgba(0,120,212,.3);
}
.ms-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(0,120,212,.4)}
.ms-btn:active{transform:none}
.ms-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ms-logo{width:20px;height:20px;flex-shrink:0}
.login-note{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6}

/* ── TOPBAR ── */
.topbar{
  padding:14px 18px 12px;
  background:rgba(11,15,26,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.tb1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 14px rgba(77,159,255,.3)}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand-user{font-size:10px;font-family:var(--mono);color:var(--dim);margin-top:2px}
.tb-acts{display:flex;gap:7px}
.room-row{display:flex;align-items:center;gap:10px}
/* ── CUSTOM ROOM DROPDOWN ── */
.room-wrap{flex:1;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:9px 12px;cursor:pointer;position:relative;transition:border-color .2s}
.room-wrap:hover{border-color:var(--border2)}
.room-sel-val{flex:1;font-size:13px;font-weight:700;font-family:var(--sans);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.room-sel-val.is-locked{color:var(--green)}
.room-chevron{color:var(--dim);font-size:11px;flex-shrink:0;transition:transform .2s}
.room-wrap.open .room-chevron{transform:rotate(180deg)}
/* Dropdown list */
.room-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:100;
  background:var(--s1);border:1px solid var(--border2);border-radius:13px;
  overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);
  display:none;animation:dropIn .18s ease;
}
.room-wrap.open .room-dropdown{display:block}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.room-opt{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;cursor:pointer;transition:background .15s;
  border-bottom:1px solid rgba(30,45,69,.5);
}
.room-opt:last-child{border-bottom:none}
.room-opt:hover{background:var(--s2)}
.room-opt.selected{background:rgba(77,159,255,.07)}
.room-opt-name{flex:1;font-size:13px;font-weight:600;font-family:var(--sans);color:var(--text)}
.room-opt.locked .room-opt-name{color:var(--green)}
.room-opt-badge{font-size:10px;font-weight:700;font-family:var(--mono);color:var(--green);flex-shrink:0;white-space:nowrap}
.room-opt-check{font-size:14px;color:var(--green);flex-shrink:0;width:16px;text-align:center}
.clk-box{text-align:right;flex-shrink:0}
.clk-t{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--blue);line-height:1}
.clk-d{font-size:9px;color:var(--dim);font-family:var(--mono);margin-top:3px}
.prog-wrap{margin-top:10px}
.prog-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);font-family:var(--mono);margin-bottom:4px}
.prog-track{height:3px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── TABS ── */
.tabs{display:flex;padding:14px 18px 0;gap:2px}
.tab{flex:1;padding:9px;text-align:center;font-size:11px;font-weight:700;font-family:var(--mono);cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);transition:all .2s;letter-spacing:.3px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.pane{display:none;overflow-y:auto;flex:1;-webkit-overflow-scrolling: touch}
.pane.on{display:block}

/* ── CHECKLIST ── */
.cl-body{padding:14px 18px;display:flex;flex-direction:column;gap:13px}
.sec{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .3s}
.sec.ok{border-color:rgba(52,211,153,.35)}
.sec.warn{border-color:rgba(251,191,36,.3)}
.sec.fail{border-color:rgba(248,113,113,.3)}
.sec-hd{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer;border-bottom:1px solid transparent;transition:border-color .2s;user-select:none}
.sec.open .sec-hd{border-bottom-color:var(--border)}
.sec-em{font-size:20px;flex-shrink:0}
.sec-info{flex:1;min-width:0}
.sec-lbl{font-size:13px;font-weight:700}
.sec-sub{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.sec-bdg{font-size:10px;font-family:var(--mono);font-weight:600;padding:3px 9px;border-radius:20px;flex-shrink:0}
.bp{background:var(--s3);color:var(--dim)}
.bok{background:rgba(52,211,153,.13);color:var(--green)}
.bfail{background:rgba(248,113,113,.13);color:var(--red)}
.bpart{background:rgba(251,191,36,.13);color:var(--amber)}
.chev{color:var(--muted);transition:transform .3s;flex-shrink:0}
.sec.open .chev{transform:rotate(180deg)}
.sec-items{display:none}
.sec.open .sec-items{display:block}
.ci{padding:12px 15px;border-bottom:1px solid rgba(30,45,69,.5)}
.ci:last-child{border-bottom:none}
.ci-row{display:flex;align-items:center;gap:9px}
.ci-ico{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:600;line-height:1.3}
.ci-note{font-size:11px;color:var(--dim);margin-top:2px}
.togs{display:flex;gap:5px;flex-shrink:0}
.tog{width:38px;height:38px;border-radius:10px;border:1.5px solid;background:transparent;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent;font-family:var(--sans)}
.tog.tp{border-color:rgba(52,211,153,.22);color:rgba(52,211,153,.3)}
.tog.tp.on{border-color:var(--green);background:rgba(52,211,153,.1);color:var(--green);box-shadow:0 0 10px rgba(52,211,153,.18)}
.tog.tf{border-color:rgba(248,113,113,.22);color:rgba(248,113,113,.3)}
.tog.tf.on{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red);box-shadow:0 0 10px rgba(248,113,113,.18)}
.tog.tn{border-color:rgba(122,138,160,.18);color:rgba(122,138,160,.3)}
.tog.tn.on{border-color:var(--dim);background:rgba(122,138,160,.08);color:var(--dim)}

/* Form controls optimized for mobile auto-zoom (font-size >= 16px) */
.spd-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.spd-in{flex:1;padding:9px 12px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:16px;font-weight:600;font-family:var(--mono);outline:none;transition:border-color .2s}
.spd-in:focus{border-color:var(--blue)}
.spd-unit{font-size:11px;color:var(--dim);font-family:var(--mono)}
.spd-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;font-family:var(--mono)}
.stg{background:rgba(52,211,153,.12);color:var(--green)}
.sto{background:rgba(251,191,36,.12);color:var(--amber)}
.stb{background:rgba(248,113,113,.12);color:var(--red)}
.fn-wrap{margin-top:8px;display:none}
.fn-ta{width:100%;padding:9px 12px;background:var(--s2);border:1px solid rgba(248,113,113,.25);border-radius:9px;color:var(--text);font-size:16px;font-family:var(--sans);outline:none;resize:none;min-height:52px}
.fn-ta::placeholder{color:var(--muted)}

/* photos */
.ph-sec{margin:0 18px 14px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:15px}
.ph-lbl{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:11px}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--s2);border:1px solid var(--border)}
.ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);border:none;color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.ph-add{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--s3);background:transparent;display:flex;font-family:var(--sans);flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--dim);font-size:10px;transition:all .2s}
.ph-add:hover{border-color:var(--blue);color:var(--blue)}
input[type=file]{display:none}

/* extras */
.extras{padding:0 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.ext-input{width:100%;padding:11px 13px;background:var(--s1);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;font-family:var(--sans);outline:none;transition:border-color .2s}
.ext-input:focus{border-color:var(--blue)}
.ext-input::placeholder{color:var(--muted)}
.ext-ta{width:100%;padding:11px 13px;background:var(--s1);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;font-family:var(--sans);outline:none;resize:none;min-height:68px}
.ext-ta::placeholder{color:var(--muted)}

/* submit */
.sub-wrap{padding:0 18px 36px}
.sub-btn{width:100%;padding:17px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--blue),var(--teal));color:#0b0f1a;font-size:15px;font-weight:800;font-family:var(--sans);cursor:pointer;display:flex;align-items:
